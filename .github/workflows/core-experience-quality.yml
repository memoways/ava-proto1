name: Core experience quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  regression-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:quality
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
